name: z01 Hourly Cloud Crawl

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/z01_hourly.yml'
      - 'z01_news_pulse/collector.py'

concurrency:
  group: z01
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run z01 News Pulse Collector & Trend Builder
        run: |
          cd z01_news_pulse
          python collector.py
          python build_trend_v2.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add z01_news_pulse/feed/ z01_news_pulse/index.html
          if git diff --staged --quiet; then
            echo "No feed changes to commit."
          else
            HOUR_KEY=$(python3 -c "from datetime import datetime, timezone, timedelta; print((datetime.now(timezone.utc) + timedelta(hours=8)).strftime('%Y-%m-%d %H:00'))")
            git commit -m "z01 snapshot ${HOUR_KEY}"
            git pull --rebase origin main
            git push origin main
          fi
